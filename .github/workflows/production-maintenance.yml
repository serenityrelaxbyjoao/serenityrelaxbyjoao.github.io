name: Production maintenance

on:
  push:
    paths:
      - '.github/workflows/production-maintenance.yml'

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe production fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = [
              Path('index.html'), Path('pt.html'), Path('en.html'),
              Path('es.html'), Path('it.html'), Path('de.html')
          ]

          old_langs = '"availableLanguage": ["fr", "pt", "en", "es"]'
          new_langs = '"availableLanguage": ["fr", "pt", "en", "es", "it", "de"]'

          for path in pages:
              text = path.read_text(encoding='utf-8')
              text = text.replace('app.js?v=5', 'app.js?v=6')
              text = text.replace(old_langs, new_langs)
              path.write_text(text, encoding='utf-8')

          fixes = {
              Path('it.html'): (
                  '"url": "https://serenityrelaxbyjoao.github.io/", "inLanguage": "it"',
                  '"url": "https://serenityrelaxbyjoao.github.io/it.html", "inLanguage": "it"'
              ),
              Path('de.html'): (
                  '"url": "https://serenityrelaxbyjoao.github.io/", "inLanguage": "de"',
                  '"url": "https://serenityrelaxbyjoao.github.io/de.html", "inLanguage": "de"'
              )
          }
          for path, (old, new) in fixes.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected JSON-LD pattern not found in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          sitemap = Path('sitemap.xml')
          if sitemap.exists():
              text = sitemap.read_text(encoding='utf-8').replace('<lastmod>2026-10-14</lastmod>', '<lastmod>2026-10-15</lastmod>')
              sitemap.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Serenity site maintenance'
          git config user.email 'serenityrelaxbyjoao@users.noreply.github.com'
          git add index.html pt.html en.html es.html it.html de.html sitemap.xml
          git commit -m 'Fix cache version and multilingual structured data'
          git push
