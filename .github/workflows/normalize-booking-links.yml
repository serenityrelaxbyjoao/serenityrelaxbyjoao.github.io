name: Normalize booking links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-booking-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update booking links and cache version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = {
              'index.html':'fr',
              'pt.html':'pt',
              'en.html':'en',
              'es.html':'es',
              'it.html':'it',
              'de.html':'de',
          }

          base = 'https://script.google.com/macros/s/AKfycbzMEVFIzDBtuAIOkuwgNSB42OtxRvoEhPibhT8O-vwhBVlixQx5LQKWhLQyTDjG6pkDMg/exec'

          for filename, lang in files.items():
              p = Path(filename)
              s = p.read_text(encoding='utf-8')

              def repl(m):
                  service = m.group(1)
                  url = f'reservation/?lang={lang}'
                  if service:
                      url += f'&amp;service={service}'
                  return f'href="{url}"'

              pattern = re.compile(r'href="' + re.escape(base) + r'\?lang=' + lang + r'(?:&amp;service=([^"&]+))?"')
              s = pattern.sub(repl, s)
              s = re.sub(r'(href="reservation/\?lang=' + lang + r'(?:&amp;service=[^"]+)?")\s+target="_blank"\s+rel="noopener"', r'\1', s)
              s = s.replace('app.js?v=7', 'app.js?v=8')
              p.write_text(s, encoding='utf-8')

          Path('.github/workflows/normalize-booking-links.yml').unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pt.html en.html es.html it.html de.html .github/workflows/normalize-booking-links.yml
          git commit -m "Normalize booking links across all languages" || exit 0
          git push
